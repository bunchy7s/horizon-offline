name: cancel-on-close
# A closed or merged pull request's queued and running checks free the runners at once.
# pull_request_target so the token can cancel runs of pull requests from forks too;
# it checks out nothing and runs no code from the pull request.
on:
  pull_request_target:
    types: [closed]
permissions:
  actions: write
jobs:
  cancel:
    # One of playhorizon's small runners, out of GitHub's shared pool: no checkout, no code of the pull request
    # (docs/ci-runners.md). SELF_HOSTED_CI=off: GitHub's runners.
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "playhorizon-light"]') || 'ubuntu-latest' }}
    steps:
      - name: Cancel the pull request's unfinished runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Every head the pull request had, not only its last: a run-parity label added on an older head left that
          # run queued after the merge (#3104, 2026-10-29). Its branch in its own repository names its runs (another
          # fork can have a branch of the same name).
          for status in queued in_progress waiting pending requested; do
            gh api -X GET "repos/$REPO/actions/runs" -f branch="$BRANCH" -f event=pull_request -f status="$status" \
              -f per_page=100 --jq ".workflow_runs[] | select(.head_repository.full_name == \"$HEAD_REPO\") | .id"
          done | sort -u | while read -r id; do
            gh run cancel -R "$REPO" "$id" || true
          done

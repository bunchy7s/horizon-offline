name: launcher-fork-build
# Builds this fork's launcher on Windows and Linux by hand (the upstream launcher.yml needs this
# fork's missing signing secrets and its own macOS runner, so it never publishes here). The
# archives are uploaded as workflow artifacts; with `publish` and a tag they are also attached
# to a release with that tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag when publishing (empty: artifacts only)"
        required: false
        default: ""
      publish:
        description: Attach the archives to a release
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            asset: horizon-launcher-linux-x86_64.tar.gz
            binary: horizon-launcher
          - name: windows
            os: windows-latest
            asset: horizon-launcher-windows-x64.zip
            binary: horizon-launcher.exe
            # The C runtime linked in: without it the launcher asks for VCRUNTIME140.dll,
            # which only the Visual C++ redistributable installs.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-${{ matrix.name }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          rm -rf dist out && mkdir -p dist out
          cp target/release/${{ matrix.binary }} dist/
          if [[ "${{ matrix.asset }}" == *.tar.gz ]]; then
            (cd dist && tar czf ../out/${{ matrix.asset }} ${{ matrix.binary }})
          else
            (cd dist && 7z a ../out/${{ matrix.asset }} ${{ matrix.binary }})
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: launcher/out/*
          retention-days: 7

  release:
    needs: build
    if: inputs.publish && inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --target "$GITHUB_SHA" \
            --title "First test" --notes "" || true
          gh release upload "${{ inputs.tag }}" dist/horizon-launcher-* --clobber

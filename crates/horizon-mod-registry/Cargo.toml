[package]
name = "horizon-mod-registry"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
publish = false
description = "The registry's submission service: GitHub sign-in, the file's checks, staging, and a pull request (docs/api/mod-index.md)"

# Its own workspace, as the telemetry server's: the game's workspace never builds a web server.
[workspace]

[dependencies]
horizon-mods = { path = "../horizon-mods", default-features = false, features = ["index"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# GitHub's API, blocking, on tokio's blocking pool: the launcher's HTTP client.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# Ratings: one SQLite file on a small volume, as the telemetry server keeps its data.
rusqlite = { version = "0.37", features = ["bundled"] }
# Draining a refused upload (already one of axum's).
http-body-util = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# A native mod's `.hnmod` for the tests (already one of horizon-mods').
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"

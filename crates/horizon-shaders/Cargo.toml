[package]
name = "horizon-shaders"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Shader packs (the shaders/ folder format): reading packs, their .properties and .lang files, and later their GLSL"

[dependencies]
horizon-core = { path = "../horizon-core" }
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in"] }
half = "2"
png = "0.18"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
# real_packs hands every translated program to the backends wgpu uses on each platform.
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "spv-out", "hlsl-out", "glsl-out", "msl-out"] }

[lints]
workspace = true

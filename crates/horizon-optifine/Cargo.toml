[package]
name = "horizon-optifine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OptiFine-format resource pack files: .properties, the name, range, biome and block matchers, paths and the optifine/ folders; CEM entity models and connected-texture rules, and the Fusion mod's connected-texture format"

[dependencies]
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[dev-dependencies]
# `cpu_seconds` for cem_expr_bench.
horizon-bench = { path = "../horizon-bench" }

[lints]
workspace = true

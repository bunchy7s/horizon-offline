[package]
name = "horizon-port-pack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "Port a Java modpack to Horizon: import, inventory, classification and data carry-over (docs/modpacks.md)"

[dependencies]
# Content path rules only (no runtime): what the game's content loader accepts.
horizon-mods = { path = "../horizon-mods", default-features = false }
serde = { version = "1", features = ["derive"] }
# Exact float parsing: the upgrade writes back the numbers it read (data pack
# upgrade), and Java reads them exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
toml = "1.1.6"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

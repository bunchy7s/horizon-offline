[package]
name = "horizon-mod-api-gen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Build-time typed native mod API generation"

[dependencies]
heck = "0.5"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

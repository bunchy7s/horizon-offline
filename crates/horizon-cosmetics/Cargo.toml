[package]
name = "horizon-cosmetics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cosmetic items drawn on players by Horizon clients: the item format, attachment to the player model's bones, simple animations, and what other players wear (fetched and cached)"

[dependencies]
base64 = "0.22"
glam = "0.30"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints]
workspace = true

[package]
name = "horizon-launcher"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Downloads, prepares and starts Horizon builds"

[workspace]

[dependencies]
# GPUI Fast (longbridge/gpui-fast): Zed's GPUI with retained views and cached scroll layers, under
# its own name. wgpu renders on Linux, not blade (#3812).
gpui = { package = "gpui-fast", version = "0.1.12" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.12", features = ["wayland", "x11", "font-kit"] }
ureq = { version = "2", features = ["json", "tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Validate and render injected trait signatures before they reach rustc.
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
# Checks the client jar and the version file found in other launchers' folders (sources.rs).
sha1 = "0.10"
# The mod browser checks Modrinth's SHA-512 before a pack reaches the game folder (browser/download.rs).
sha2 = "0.10"
# The secrets file is encrypted where no keychain answers (account.rs, FileStore).
chacha20poly1305 = "0.10"
pulldown-cmark = { version = "0.12", default-features = false }
flate2 = "1"
tar = { version = "0.4", default-features = false }
toml = "1.1"
semver = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
dirs = "5"
# The system's preferred languages, for the window's language (i18n.rs).
sys-locale = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
horizon-theme = { path = "../crates/horizon-theme" }
horizon-core = { path = "../crates/horizon-core" }
horizon-prepare = { path = "../crates/horizon-prepare" }
# Join a friend: invite codes (the game does the joining).
horizon-friends = { path = "../crates/horizon-friends" }
horizon-bench = { path = "../crates/horizon-bench" }
# Import modpack: the porting pipeline, run on the player's own files (docs/modpacks.md).
horizon-port-pack = { path = "../crates/horizon-port-pack" }
# Horizon's mod registry: its index and the checks a download passes before install.
horizon-mods = { path = "../crates/horizon-mods", features = ["index"] }
# Signed updates: archives are checked against the release's signed checksums (docs/security.md).
horizon-release-sign = { path = "../crates/horizon-release-sign" }
# Opt-in data collection: the consent, the outbox and its upload (docs/telemetry.md).
horizon-telemetry = { path = "../crates/horizon-telemetry" }
# The official server's count follows its SRV record, as the game does (server_redirect).
horizon-protocol = { path = "../crates/horizon-protocol" }
# level.dat and servers.dat (the worlds and server lists of instances)
horizon-world = { path = "../crates/horizon-world" }
# Deleting a world moves it to the system's trash
trash = "5"
# Backup names carry the local time, as vanilla's do
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The session file's random name.
getrandom = "0.3"
# Players' heads on the Servers page, from the default skins in the player's own game files (already
# in the lockfile through gpui).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Native builds at low priority (rust_toolchain::low_priority); already in the lockfile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Microsoft account secrets in the OS keychain: the Secret Service on Linux through oo7 (the same
# build gpui uses), Keychain and Credential Manager through keyring.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Decode Keychain OSStatus errors without matching localized error strings (account.rs).
security-framework = "3"
# Painting the window's title bar dark or light (titlebar::apply_appearance), and the system's
# reduced motion (sky::moves): crates already in the lockfile through gpui and wgpu.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSAppearance", "NSView", "NSWindow", "NSWorkspace"] }
raw-window-handle = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The computer's memory, the end of the Launch panel's memory slider; already in the lockfile.
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(windows)'.build-dependencies]
# The icon resource in the .exe (build.rs).
winresource = "0.1"

[dev-dependencies]
# Tokenize source strings for the translation completeness test, including multiline calls.
proc-macro2 = "1"
syn = "2"

[profile.release]
strip = true

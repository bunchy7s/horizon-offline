dev = """Merged: the registry index (schema 1, `.hpack`, checks before install, #1634), `cargo horizon-mod check` \
(#1642) and the submission service (`crates/horizon-mod-registry`, #1659). In review: the website's /mods (#1596) \
and /mods/submit (#1635), and in the launcher the registry as a source (#1636), install, enable and takedowns \
(#1637), the Mods page (#1638) and modpacks as their own profiles (#1640)."""
links = ["#1634", "#1642", "#1659", "#1596", "#1635", "#1636", "#1637", "#1638", "#1640", "docs/mods.md"]

[[item]]
id = "native-mods"
title = "Native mods, built by the launcher"

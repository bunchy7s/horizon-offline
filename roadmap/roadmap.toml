[[item]]
id = "smooth-frames"
title = "Steady frames at long render distances"
status = "now"
area = "performance"
focus = true
owner = "ludovic111"
issue = "#3909"
plain = """Making Horizon faster than vanilla on every computer, with smooth camera movement even at 32 chunks, \
by spreading the work better over the processor's cores."""
dev = """Frame pacing at render distance 32 (#678): long frames come from work competing with the render thread. \
In review: no main-thread tick stutter at high render distances (#3827), each proto chunk's light view built once \
(#3815), video memory handed back by the vertex arena (#3466), chunk batches assembled on helper threads (#3036), \
free structure starts in the generation workers (#1760). Still open: far terrain at 48 to 64 chunks (#718) and CPU-bound fields of block entities (#717). Every \
change shows before and after numbers from `tools/perf_bench.py` against vanilla 26.3 (docs/benchmark.md)."""
links = ["#3827", "#3815", "#3466", "#3036", "#1760", "#678", "#718", "#717", "docs/benchmark.md"]

[[item]]
id = "modpack-worldgen"
title = "Modpacks' world generation, natively"
status = "now"
area = "modpacks"
ongoing = true
owner = "ThatCakeIsAPie"
issue = "#3913"
announce = true
focus = true
plain = """Making the world-generation mods of popular modpacks (new structures, YUNG's dungeons and mineshafts, \
packs built on Lithostitched) generate their worlds in Horizon, natively and fast."""
dev = """`horizon-port-pack` carries a pack's data-driven content over, and 26.2 data packs are upgraded to 26.3's \
format (#3369). In review: worlds taller than 32 sections and each level's shape from its dimension type (#3480, \
#3488), data-pack biomes in local and remote worlds (#3491), block state providers (#3802), surface rules by biome \
id (#3366), Lithostitched's pool and processor modifiers (#1777). Mods whose Java code does more than world \
generation don't run (docs/modpacks.md)."""
links = ["#3369", "#3480", "#3488", "#3491", "#3802", "#3366", "#1777", "docs/modpacks.md"]

[[item]]

area = "mods"
ongoing = true
plain = """Horizon's own mods become native code that the launcher builds into your game, with no Rust to install: Zoom, FPS Counter, Keystrokes and Minimap already are, and Recipes is next."""
dev = """Stable hook points in the game (game/native_hooks.rs, #3345, #3346; v2 with the item panel and recipe pages, #3434, #3435), horizon-mixins applied by the launcher with its own portable Rust (#3388), on/off in Options > Mods. The official mods live in horizon-mods/native/ and are in the registry as native mods. Next: Recipes, native mods on automatically when a player installs one (with a notice about the first build), then the WebAssembly runtime is removed (#3350, #3351, #3353, #3371)."""
links = ["#3345", "#3346", "#3388", "#3434", "#3435", "docs/native-mods.md"]

[[item]]
id = "java-instances"

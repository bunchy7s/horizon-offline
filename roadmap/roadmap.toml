dev = """Cut the per-column generation cost (noise sampling, surface rules, aquifers) and the lock convoy on \
structure starts, and leave one core free for the rest of the game as vanilla does (#1760 and #1778, in \
review, are listed under 'Steady frames at long render distances'). Still to profile on small CPUs: the \
first seconds of a fresh world deliver no chunk, and fluids remesh for about a minute after loading. \

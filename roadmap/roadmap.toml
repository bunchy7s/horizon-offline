# Horizon's roadmap: the one source of truth for ROADMAP.md, playhorizon.dev/roadmap and Kira's answers.
# Edit this file, then run `python3 tools/roadmap.py build`. How to keep it current: roadmap/README.md.
#
# No dates, ever: an item is Now, Next or Later. Each item says the same thing twice: `plain` for players
# (one or two sentences, at most 240 characters, so it fits a post when it ships) and `dev` for contributors
# (crates, approach, what is left). Links are "#123" (an issue or a pull request), a path in the repository,
# or an https URL. Only what is decided goes here; ideas wait in GitHub issues and the suggestion queue.
# `focus = true` puts a Now item in the overview (3 to 5 of them). `ongoing = true` marks a workstream that goes on
# after its linked pull requests merge: `sync` never ships it, so link its new pull requests as they open.

[overview]
today_plain = """Horizon is Minecraft: Java Edition 26.3 rewritten from scratch in Rust, so it runs faster on the \
same computer. Single player, LAN, servers, resource packs and Horizon's own mods work today, on your own copy of \
the game."""
today_dev = """A native Rust and wgpu reimplementation of Java 26.3: the same saves, rules and terrain, checked \
against the real game by more than 300 differential harnesses (a Java oracle and a Rust probe on the same inputs). \
Single player runs on its own server thread, like vanilla's integrated server."""
help_plain = """Play it and tell us what differs from vanilla (Discord or GitHub), run the benchmark on your \
computer, vote for what you want next, or pick one of the Help wanted items."""
help_dev = """Read CONTRIBUTING.md, pick a Help wanted item or a To do card, check vanilla's code for the \
behaviour, and paste the block `python3 tools/pr_ready.py` prints in your pull request."""


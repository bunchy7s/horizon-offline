# ---------------------------------------------------------------------------------------------------- Now

[[item]]
id = "smooth-frames"
title = "Steady frames at long render distances"
status = "now"
area = "performance"
focus = true
plain = """Making Horizon faster than vanilla on every computer, with smooth camera movement even at 32 chunks, \
by spreading the work better over the processor's cores."""
dev = """Frame pacing at render distance 32 (#678): long frames come from work competing with the render thread. \
In review: world generation workers build free structure starts instead of queueing them (#1760), the worker pool \
leaves one core as vanilla does (#1778), and the terrain vertex arena is read as storage where flat draws run \
(#1742). Still open: far terrain at 48 to 64 chunks (#718) and CPU-bound fields of block entities (#717). Every \
change shows before and after numbers from `tools/perf_bench.py` against vanilla 26.3 (docs/benchmark.md)."""
links = ["#678", "#1760", "#1778", "#1742", "#718", "#717", "docs/benchmark.md"]

[[item]]
id = "block-storage"
title = "Faster block lookups"
status = "now"
area = "performance"
plain = """Speeding up the code that reads and writes the blocks of the world, which almost everything in the game \
goes through: generation, lighting, meshing and ticking."""
dev = """`PalettedContainer` and `PackedStorage` find an entry's word by multiply and shift instead of an integer \
division (#1790, #1794); meshing looks up baked models by index, not by name (#1747). Each change keeps the paletted \
storage harnesses identical and shows its microbenchmark (docs/performance/paletted-container-access-results.md)."""
links = ["#1790", "#1794", "#1747", "docs/performance/paletted-container-access-results.md"]

[[item]]
id = "modpack-worldgen"
title = "Modpacks' world generation, natively"
status = "now"
area = "modpacks"
announce = true
focus = true
plain = """Making the world-generation mods of popular modpacks (new structures, YUNG's dungeons and mineshafts, \
packs built on Lithostitched) generate their worlds in Horizon, natively and fast."""
dev = """`horizon-port-pack` carries a pack's data-driven content over; structure mods that need code get a native \
port: YUNG's worldgen as written (#1746), Lithostitched's limited and guaranteed elements with pool and processor \
modifiers (#1777), its processors as the game's own types (#1765). Proved by the structure blocks and layout \
harnesses (#1753, #1757). Mods whose Java code does more than world generation don't run (docs/modpacks.md)."""
links = ["#1746", "#1777", "#1765", "#1753", "#1757", "docs/modpacks.md"]

[[item]]
id = "server-clients"
title = "Playing on servers: everything shows as it should"
status = "now"
ongoing = true
area = "servers"
focus = true
plain = """When you play on a server, other players, mobs, items and menus look and behave as in vanilla: skins, \
poses, item names, inventories and server networks."""
dev = """Client-of-a-server fixes in `game/remote*.rs` and `horizon-protocol`: mobs' aggressive and item-use flags \
(#1802, #1798), ghost items after a remote menu (#1795), skins (#1652), cookies and transfer packets for proxy \
networks (#1650), firework boosts (#1671), living-entity attributes and simulation distance (#1731), styled item \
names (#1702), primed TNT between updates (#1710)."""
links = ["#1802", "#1798", "#1795", "#1652", "#1650", "#1671", "#1731", "#1702", "#1710"]

[[item]]
id = "server-thread"
title = "Single player as a server: the last differences"
status = "now"
ongoing = true
area = "gameplay"
focus = true
plain = """Single player now runs a small server in the background, as vanilla does. We are fixing what still \
behaves differently there; every fix also works for LAN and server players."""
dev = """Since #1514 single player runs on the server thread (`game/integrated.rs`) and the window joins it as a \
client; `--in-frame` keeps the old path. The open `[server-thread]` issues list the gaps. In review: a tool that \
changes a block ends the click (#1797), potions keep their potion over the connection (#1796), mobs' aggression \
and arm swings (#1802). docs/server-levels.md."""
links = ["#1514", "#1797", "#1796", "#1802", "docs/server-levels.md"]


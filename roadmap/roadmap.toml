links = ["docs/benchmark.md", "docs/profiling.md"]

[[item]]
id = "server-tick"
title = "Servers that hold 20 TPS with 50 to 100 players"
status = "next"
area = "performance"
plain = """Servers that keep 20 ticks per second with 50 to 100 players. Today Horizon holds it up to 50 bots and drops \
to about 10 at 100."""
dev = """Measured against vanilla on equal work (docs/server.md, Scale): Horizon is ahead with few players and when \
exploring, but vanilla's tick is shorter with 25 to 50 players near spawn. Ideas on the list: send entity \
changes instead of rebuilding every entity each tick (about 15 percent), fewer memory reads in random ticks \
and collision scans, cheaper item collision checks, mob AI and natural spawning. The bot benchmark \
(`horizon-bots`) is the proof."""
links = ["docs/server.md"]

